<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center">
    <h2 class="text-2xl font-bold text-red-600 mb-2">Operation Halted</h2>
    <p class="text-slate-600 mb-6" th:text="${errorMessage}">An error occurred.</p>
    <a href="javascript:history.back()" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700">Go Back</a>
</div>
</body>
</html>
