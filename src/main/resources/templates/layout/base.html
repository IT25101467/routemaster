<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteMaster &bull; Express Transit System</title>
    <!-- Tailwind CSS CDN for instant rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">
<!-- Top Navigation Bar: Frosted Glass Effect -->
<nav class="bg-white/80 backdrop-blur-md border-b border-slate-200/50 sticky top-0 z-50 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
                <a href="/" class="flex items-center space-x-2.5 group">
                    <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm group-hover:bg-blue-700 transition">
                        RM
                    </div>
                    <span class="text-base font-semibold tracking-tight text-slate-900 group-hover:text-blue-600 transition">RouteMaster</span>
                </a>
                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">Lanka Express</span>
            </div>
            <!-- Role-Scoped Navigation Links -->
            <div class="hidden md:flex items-center space-x-1 text-xs font-medium">
                <a href="/booking/search" class="text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 px-3.5 py-2 rounded-xl transition-all">F1: Book Seat</a>
                <a href="/fleet/buses" class="text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 px-3.5 py-2 rounded-xl transition-all">F2: Fleet</a>
                <a href="/operations/trips" class="text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 px-3.5 py-2 rounded-xl transition-all">F3: Operations</a>
                <a href="/support/tickets" class="text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 px-3.5 py-2 rounded-xl transition-all">F4: Support</a>
                <a href="/finance/dashboard" class="text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 px-3.5 py-2 rounded-xl transition-all">F5: Finance</a>
                <a href="/station-board" class="text-blue-600 bg-blue-50/60 hover:bg-blue-100/60 px-3.5 py-2 rounded-xl transition-all font-semibold">F6: Live Board</a>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content Container -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div th:replace="${content}">
        <!-- Page-specific content renders here -->
    </div>
</main>

<footer class="bg-white/50 backdrop-blur-sm border-t border-slate-200/40 py-6 text-center text-xs text-slate-400">
    SE2030 Group Project &bull; Year 2 Semester 1 &bull; RouteMaster Transit System
</footer>
</body>
</html>
