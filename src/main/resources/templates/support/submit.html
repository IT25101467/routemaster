<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Passenger Complaint &bull; RouteMaster Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 antialiased selection:bg-blue-500 selection:text-white">

<!-- Navigation: Frosted Glass -->
<nav class="bg-white/80 backdrop-blur-md border-b border-slate-200/50 sticky top-0 z-40 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
                <a href="/" class="flex items-center space-x-2.5 group">
                    <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm group-hover:bg-blue-700 transition">
                        RM
                    </div>
                    <span class="text-base font-semibold tracking-tight text-slate-900 group-hover:text-blue-600 transition">RouteMaster</span>
                </a>
                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">Passenger Support</span>
            </div>
            <div class="flex items-center space-x-2 text-xs font-medium">
                <a href="/booking/search" class="text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 px-3 py-1.5 rounded-xl transition">Booking</a>
                <a href="/support/tickets" class="bg-slate-100 text-slate-900 px-3 py-1.5 rounded-xl font-semibold transition">Officer Portal</a>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-2xl mx-auto py-12 px-4 sm:px-6">

    <!-- Flash Notifications -->
    <div th:if="${successMessage}" class="mb-6 bg-emerald-50/80 border border-emerald-100 rounded-2xl p-5 shadow-xs">
        <div class="flex items-start space-x-3">
            <svg class="w-5 h-5 text-emerald-600 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <div>
                <h3 class="text-xs font-semibold text-emerald-900 uppercase tracking-wider">Complaint Submitted Successfully</h3>
                <p class="text-sm text-emerald-800 mt-1" th:text="${successMessage}"></p>
                <div th:if="${refNo}" class="mt-2 text-xs font-mono font-semibold text-emerald-700 bg-emerald-100/60 px-3 py-1 rounded-full inline-block">
                    Tracking Ref: <span th:text="${refNo}"></span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${errorMessage}" class="mb-6 bg-rose-50/80 border border-rose-100 rounded-2xl p-4 text-sm text-rose-900 font-medium shadow-xs">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Complaint Form Card -->
    <div class="bg-white rounded-2xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 p-8">
        <div class="flex items-center justify-between pb-6 mb-6">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Passenger Care &amp; Support</h1>
                <p class="text-xs text-slate-500 mt-1">Submit feedback, report a trip delay, or report transit irregularities (BR-14)</p>
            </div>
            <span class="text-xs bg-blue-50 text-blue-700 font-mono font-medium px-3 py-1 rounded-full">Module F4</span>
        </div>

        <form th:action="@{/support/submit}" th:object="${complaintForm}" method="post" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Booking Reference (Optional)</label>
                <input type="text" th:field="*{bookingRef}" placeholder="e.g. RM-XXXXXXXX"
                       class="w-full rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400">
                <p class="text-xs text-slate-400 mt-1">Include if your complaint relates to a specific ticket</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Passenger Full Name</label>
                    <input type="text" th:field="*{passengerName}" placeholder="e.g. K.A. Silva"
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400" required>
                    <p class="text-xs text-rose-500 mt-1" th:if="${#fields.hasErrors('passengerName')}" th:errors="*{passengerName}"></p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Contact Phone Number</label>
                    <input type="text" th:field="*{contactNumber}" placeholder="0771234567"
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400" required>
                    <p class="text-xs text-rose-500 mt-1" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></p>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Complaint Category</label>
                <select th:field="*{category}" class="w-full rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 px-4 py-3 text-sm text-slate-900" required>
                    <option value="TRIP_DELAY">Trip Delay / Schedule Disruption</option>
                    <option value="SEAT_COMFORT">Seat Allocation / AC Issue</option>
                    <option value="STAFF_CONDUCT">Driver / Conductor Conduct</option>
                    <option value="PAYMENT_INQUIRY">Payment / Fare Inaccuracy</option>
                    <option value="OTHER">Other Operational Concern</option>
                </select>
                <p class="text-xs text-rose-500 mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Detailed Description</label>
                <textarea th:field="*{description}" rows="4" placeholder="Please describe the incident, including stop location and timing..."
                          class="w-full rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400" required></textarea>
                <p class="text-xs text-rose-500 mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="/" class="rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium px-5 py-3 transition-all text-sm">Cancel</a>
                <button type="submit" class="rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 shadow-sm transition-all text-sm active:scale-[0.98]">
                    Submit Complaint &rarr;
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
